# Nightly: the live tier against each runner's NATIVE tmux, not the pin.
#
# check.yml proves Ward against one pinned tmux (mise.toml [vars]), so a PR
# never goes red because a runner image moved. The price of the pin is that a
# tmux Ward's users actually run can drift away from it unseen; this workflow
# is where that drift shows. It gates nothing.
#
# Who learns of a red night: the job keeps one open issue, titled below, as the
# standing record. A failure opens it (or comments on it, when it is already
# open) with the tmux versions and a link to the run; the next green night
# comments and closes it. A new issue notifies the repository's watchers, its
# owner among them; GitHub's own mail for a failed scheduled run goes only to
# whoever last edited the cron line, which is not a recipient anyone chose.
name: nightly native tmux

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: live native tmux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # Run against whatever tmux the runner has, unchecked against the pin.
      WARD_TMUX_PIN: native
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5

      # The runner image's tmux when it has one (ubuntu-latest does), else the
      # platform's package manager's: what a user of that platform gets.
      - name: Install the native tmux
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get update -qq && sudo apt-get install -y -qq tmux
            else
              brew install tmux
            fi
          fi
          echo "native: $(tmux -V) at $(command -v tmux)"

      - run: mise run test:live
        env:
          WARD_LIVE_EVIDENCE: ${{ runner.temp }}/live-evidence

      - name: Upload live-tier evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-live-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/live-evidence
          retention-days: 14

  report:
    name: report
    if: always()
    needs: [live]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: 'Nightly: the live tier fails against a native tmux'
      RESULT: ${{ needs.live.result }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update, or close the nightly issue
        run: |
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Green again against the native tmux: $RUN"
            fi
            exit 0
          fi
          body=$(printf '%s\n\n%s %s %s\n' \
            "The live tier ($RESULT) against each runner's native tmux: $RUN" \
            "The PR gate runs against the pinned tmux (mise.toml), so this blocks no merge;" \
            "it means a tmux Ward's users run has drifted from what the gate proves. Reproduce" \
            "with WARD_TMUX_PIN=native mise run test:live on that tmux; the run has the evidence.")
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
