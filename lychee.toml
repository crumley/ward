# lychee — broken-link checker for Ward docs.
#
# Links that matter in this repo are internal relative paths, so we run in
# offline mode: lychee verifies that each linked file exists on disk and makes
# no network requests (fast, deterministic, CI-safe). External URLs (e.g. in
# ADRs) are skipped by design; drop `offline` for a scheduled run if that ever
# matters — see mise.toml (`mise run links`).

# Only check the local filesystem; never hit the network.
offline = true

# Validate `#heading` anchor fragments against the target document's headings.
include_fragments = "anchor-only"

# Don't descend into VCS internals or installed dependencies.
exclude_path = ['\.git/', 'node_modules/']
